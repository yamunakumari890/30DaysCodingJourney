<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 30 Gradient Color Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎨 Gradient Color Generator</h1>

    <div class="gradient-box" id="gradientBox">
      Beautiful Gradient
    </div>

    <div class="colors">

      <p>
        Color 1:
        <span id="color1">#6c5ce7</span>
      </p>

      <p>
        color 2:
        <span id="color2">#00bb94</span>
      </p>

    </div>

    <button id="generateBtn">✨ Color Generator</button>


  <div class="css-container">
    <p>CSS Code:</p>

    <code id="cssCode">
      bacground: linear-gradiant(135deg, #6c5ce7, #00bb94);
    </code>
  </div>

  <button id="copyBtn">
    📋 Copy CSS
  </button>

  </div>
  
</body>
<script src="script.js"></script>
</html>
