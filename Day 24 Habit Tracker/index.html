<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to DAY 24</title>
  <link rel="styleSheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> 📅 Habit Tracker</h1>

    <div class="input-box">

    <input type="text" id="habitInput" placeholder="Enter Your habit...">

    <button id="addBtn">
      Add Habit
    </button>

    </div>

    <div class="progress-section">

      <h2>📊 Today's Progress: 
        <span id="progress">0%</span>
      </h2>
    </div>

    <div id="habitList">

    </div>

    <button id="resetBtn">
      🔄 Reset
    </button>
  </div>
  
</body>
<script src="script.js"></script>
</html>
