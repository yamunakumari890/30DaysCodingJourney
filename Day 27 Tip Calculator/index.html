<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Day 27</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> 🧮 Tip Calculator </h1>
    <p>Calculate your tip easily!</p>

    <div class="input-group">

    <label for="billAmount">Bill Amount</label>

    <input type="number" id="billAmount" placeholder="Enter bill amount">
  
  </div>

  <div class="input-group">
    <label for="tipPercentage">Tip Percentage (%) </label>

    <input type="number" id="tipPercentage" placeholder="Enter tip percentage">
  </div>

  <button id="calculateBtn">Calculate Tip</button>

  <div class="result">
    <p>
      Tip Amount:
      ₹<span id="tipAmount">0</span>
    </p>

    <p>
      Total Amount:
      ₹<span id="totalAmount">0</span>
    </p>

  </div>

  </div>
  
</body>
<script src="script.js"></script>
</html>
